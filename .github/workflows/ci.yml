name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff==0.15.16
      - name: Lint
        run: python -m ruff check opsgraph tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check console JavaScript
        run: node --check console/app.js

  real-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and perf
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 120 python -m pip install --upgrade pip --retries 2 --timeout 30
          timeout 120 python -m pip install -r requirements.txt --retries 2 --timeout 30
          timeout 300 sudo -E apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true
          timeout 300 sudo -E apt-get install -y --no-install-recommends gcc linux-tools-common linux-tools-generic -o Dpkg::Options::=--force-confold -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true
          timeout 60 perf --version
      - name: Allow own-process perf sampling
        run: sudo sysctl -w kernel.perf_event_paranoid=1
      - name: Real perf capture -> C RCA -> 10-case REA
        run: python -m opsgraph real-perf-rea
      - name: Upload real perf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-perf-rea
          path: |
            artifacts/real_perf_rea.json
            artifacts/real-perf-rea.md
          if-no-files-found: warn
